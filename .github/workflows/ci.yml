name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test dependencies
        # The unit tests exercise the pure helpers only; the NHANES data and the
        # modelling packages (glmnet, xgboost, shapviz, ...) are not needed.
        run: Rscript -e 'install.packages(c("testthat", "pROC"))'
      - name: Run tests
        run: Rscript tests/run_tests.R
